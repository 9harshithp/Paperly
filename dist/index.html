<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17161d"><title>Paperly — Paper Plane Adventure</title><meta name="description" content="Fly a folded paper plane across fifteen chapters, collect Quantum, and build your hangar."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="style.css"><script defer src="vendor/pixi.min.js"></script><script type="module" src="js/main.js"></script></head>
<body><main id="app">
<header><button class="brand" id="home" aria-label="Paperly home"><i data-icon="logo"></i><span>Paperly</span></button>
<nav aria-label="Game navigation"><button id="nav-chapters" class="nav on"><i data-icon="map"></i>Chapters</button><button id="nav-hangar" class="nav"><i data-icon="hangar"></i>Hangar</button><button id="nav-log" class="nav"><i data-icon="log"></i>Flight log</button></nav>
<div class="system"><span id="wallet" title="Quantum balance"><i data-icon="gem"></i><b id="balance">0</b></span><span class="divider"></span><button id="audio" class="icon-btn" aria-label="Mute sound"></button><button id="settings" class="icon-btn" aria-label="Settings"><i data-icon="settings"></i></button></div></header>
<div id="home-screen">
<section class="hero" id="hero"><div class="scene" id="scene"></div><div class="vignette"></div>
<div class="hero-art" aria-hidden="true"><svg class="trails" viewBox="0 0 1000 500" preserveAspectRatio="none"><defs><linearGradient id="fade"><stop stop-color="#ece3fa" stop-opacity="0"/><stop offset=".44" stop-color="#fff1f6" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient></defs><path d="M-130 445 C195 323 262 488 500 339 S670 256 751 219" stroke="url(#fade)" stroke-width="2" fill="none"/><path d="M-120 451 C159 336 306 464 496 354 S686 273 758 240" stroke="url(#fade)" stroke-width="1.2" fill="none"/></svg><div class="plane-wrap"><img id="hero-plane" src="art/hero-plane.webp" alt=""></div></div>
<div class="hero-copy"><div class="eyebrow"><span class="accent-bar"></span><span id="mode-label">STORY MODE</span><span class="slash">/</span><span id="chapter-label">CHAPTER 01</span></div>
<h1 id="chapter-title">Icy Dunes</h1><p id="description">Glide through a quiet valley of snow-dusted pines and violet peaks.</p>
<div class="hero-actions"><button id="launch" class="primary"></button><button class="ghost" id="how"><i data-icon="help"></i>How to play</button></div></div>
<div class="scene-caption"><span class="caption-line"></span><span id="plane-caption">AERO</span><span class="caption-dot">·</span> <span>FOLDED PAPER</span></div>
</section>
<section class="shelf"><div class="shelf-top"><div class="shelf-title"><i data-icon="layers"></i><h2>Chapter select</h2><span id="total">15 CHAPTERS</span></div><div class="rail-buttons"><span id="position">01 <em>/ 15</em></span><button id="prev" class="round" aria-label="Previous chapters"><i data-icon="left"></i></button><button id="next" class="round" aria-label="Next chapters"><i data-icon="right"></i></button></div></div><div class="cards" id="cards" aria-label="Chapters"></div></section>
<footer><div class="keys"><i data-icon="keyboard"></i><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Steer</span><span><kbd>SHIFT</kbd> Boost</span><span><kbd>ESC</kbd> Pause</span></div><button class="mode-button" id="mode">Story mode <i data-icon="down"></i></button></footer>
</div>
<div id="flight" hidden><div id="world"></div><div id="hud"><div class="hud-top"><button class="round" id="pause" aria-label="Pause flight"><i data-icon="pause"></i></button><div class="hud-route"><strong id="hud-name"></strong><div class="line"><b id="progress"></b></div><small id="hud-plane"></small></div><span id="hud-rings" hidden></span><span id="hud-time" aria-label="Time remaining"></span><span id="hud-quantum"></span></div>
<div id="flight-notice" role="status"></div><div class="hud-lower"><div class="boost-box"><span>WIND BOOST</span><div class="line"><b id="boost-fill"></b></div></div><div class="speed"><b id="speed">0</b><small>KM/H</small></div></div>
<div id="touch"><div id="stick"><b></b></div><div id="arrows"><button data-dir="up" aria-label="Climb">▲</button><button data-dir="left" aria-label="Bank left">◀</button><button data-dir="down" aria-label="Dive">▼</button><button data-dir="right" aria-label="Bank right">▶</button></div><button id="touchboost">BOOST</button></div></div></div>
<dialog id="dialog"><div class="dialog-top"><span class="dialog-eyebrow" id="dialog-label"></span><button class="round" id="close" aria-label="Close dialog"><i data-icon="x"></i></button></div><div id="dialog-content"></div></dialog>
</main></body></html>
